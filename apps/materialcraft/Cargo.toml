[package]
name = "materialcraft"
description = "MaterialCraft: an open-source node-based procedural material designer (desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "materialcraft"
build = "build.rs"

[lints]
workspace = true

[dependencies]
materialcraft-engine = { workspace = true }
materialcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
egui = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
winresource = "0.1"
